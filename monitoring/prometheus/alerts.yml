groups:
  - name: grubadmin-backend
    rules:
      - alert: BothProductionSlotsUnavailable
        expr: count(up{job="backend"}) == 2 and sum(up{job="backend"}) == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Both production backend slots are unavailable
          description: Prometheus cannot scrape either production backend instance.

      - alert: ActiveBackendUnavailable
        expr: |
          (up{job="backend"} == 0)
          * on (deployment_slot) group_left()
          (grubadmin_active_slot{deployment_slot=~"blue|green"} == 1)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Active production backend slot is unavailable
          description: The active blue-green slot has failed its authenticated metrics scrape.

      - alert: StandbyBackendUnavailable
        expr: |
          (up{job="backend"} == 0)
          * on (deployment_slot) group_left()
          (grubadmin_active_slot{deployment_slot=~"blue|green"} == 0)
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Standby production backend slot is unavailable
          description: The warm standby slot is unavailable and rollback readiness may be affected.

      - alert: HighBackendHttp5xxRate
        expr: |
          sum(rate(grubadmin_http_requests_total{job="backend",status_code=~"5.."}[5m]))
          / clamp_min(sum(rate(grubadmin_http_requests_total{job="backend"}[5m])), 0.1) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend HTTP 5xx rate is above 5%
          description: More than 5% of backend requests have returned 5xx responses for 5 minutes.

      - alert: HighBackendP95Latency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(grubadmin_http_request_duration_seconds_bucket{job="backend"}[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Backend P95 latency is above one second
          description: Backend P95 request latency has exceeded one second for 10 minutes.

      - alert: Ec2HighCpuUsage
        expr: 1 - avg(rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: EC2 CPU usage is above 85%
          description: Average CPU usage has exceeded 85% for 10 minutes.

      - alert: Ec2HighMemoryUsage
        expr: 1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"}) > 0.90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: EC2 memory usage is above 90%
          description: Available host memory has remained below 10% for 10 minutes.

      - alert: Ec2LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs"}) < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: EC2 filesystem has less than 10% free space
          description: A monitored host filesystem has less than 10% free space.

      - alert: LokiUnavailable
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Loki is unavailable
          description: Prometheus cannot scrape Loki's internal metrics endpoint.

      - alert: PrometheusScrapeFailure
        expr: up{job=~"node-exporter|alloy|grafana"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: A production monitoring scrape is failing
          description: Check the target's health, network, or metrics credentials.
