global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]
        labels:
          service: grubadmin-monitoring
          environment: production
          branch: main

  - job_name: backend
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 5s
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics-token
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: grubadmin-backend
          environment: production
          branch: main
          deployment_slot: green
      - targets: ["host.docker.internal:8003"]
        labels:
          service: grubadmin-backend
          environment: production
          branch: main
          deployment_slot: blue

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: grubadmin-ec2
          environment: production
          branch: main

  - job_name: loki
    metrics_path: /metrics
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: grubadmin-monitoring
          environment: production
          branch: main

  - job_name: alloy
    metrics_path: /metrics
    static_configs:
      - targets: ["alloy:12345"]
        labels:
          service: grubadmin-monitoring
          environment: production
          branch: main

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grubadmin-monitoring
          environment: production
          branch: main
